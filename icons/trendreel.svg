<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TrendReel">
  <title>TrendReel — auto-generated trending YouTube videos</title>
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E54848"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="tr-play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFE4E4"/>
    </linearGradient>
  </defs>
  <!-- rounded square background (iOS app-icon corner radius ~22%) -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#tr-bg)"/>
  <!-- film perforations: top + bottom strips of dots/squares for film-reel hint -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="36" y="42" width="14" height="10" rx="2"/>
    <rect x="62" y="42" width="14" height="10" rx="2"/>
    <rect x="88" y="42" width="14" height="10" rx="2"/>
    <rect x="154" y="42" width="14" height="10" rx="2"/>
    <rect x="180" y="42" width="14" height="10" rx="2"/>
    <rect x="206" y="42" width="14" height="10" rx="2"/>
    <rect x="36" y="204" width="14" height="10" rx="2"/>
    <rect x="62" y="204" width="14" height="10" rx="2"/>
    <rect x="88" y="204" width="14" height="10" rx="2"/>
    <rect x="154" y="204" width="14" height="10" rx="2"/>
    <rect x="180" y="204" width="14" height="10" rx="2"/>
    <rect x="206" y="204" width="14" height="10" rx="2"/>
  </g>
  <!-- central play triangle -->
  <path d="M 100 80 L 188 128 L 100 176 Z" fill="url(#tr-play)" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- subtle upward-trend spark inside the play -->
  <path d="M 116 156 L 132 138 L 144 148 L 168 116" fill="none" stroke="#E54848" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="168" cy="116" r="3.5" fill="#E54848"/>
</svg>
