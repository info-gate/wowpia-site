<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)인포게이트 디지털 명함</title>
  <meta name="description" content="주식회사 인포게이트의 디지털 명함 목록. 각 담당자의 이름을 눌러 명함 페이지로 이동, 탭 한 번으로 연락처 저장 가능.">
  <link rel="canonical" href="https://wowpia.kr/card/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#1e5aa8">
  <link rel="icon" type="image/png" href="../favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Info-Gate Inc.">
  <meta property="og:title" content="(주)인포게이트 디지털 명함">
  <meta property="og:description" content="담당자별 디지털 명함 · 탭 한 번으로 연락처 저장 · wowpia.kr">
  <meta property="og:url" content="https://wowpia.kr/card/">
  <meta property="og:image" content="https://wowpia.kr/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #1e5aa8;
      --brand-dark: #17457f;
      --accent: #f5b800;
      --ink: #0f1419;
      --ink-soft: #3A3F47;
      --ink-mute: #7A828C;
      --bg: #F1F3F7;
      --card: #ffffff;
      --rule: #E5E5E0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #d4e0f0 0%, transparent 50%),
        radial-gradient(900px 500px at 90% 110%, #fff3cf 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 32px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1e5aa8 0%, #17457f 100%);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      text-decoration: none;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px -8px rgba(30,90,168,0.4);
    }
    .brand-mark { width: 22px; height: 22px; border: 2.5px solid #fff; position: relative; }
    .brand-mark::after { content: ""; position: absolute; inset: 4px; background: var(--accent); }
    .brand span {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      letter-spacing: 1.5px;
      font-size: 15px;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 36px);
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }
    h1 em { font-style: italic; color: var(--brand); font-weight: 500; }
    .lead {
      color: var(--ink-mute);
      font-size: 14.5px;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .list { display: grid; gap: 14px; }
    .person {
      background: var(--card);
      border-radius: 18px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px -6px rgba(15,20,25,0.08), 0 0 0 1px rgba(15,20,25,0.04);
    }
    .person:hover, .person:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -12px rgba(30,90,168,0.25), 0 0 0 1px rgba(30,90,168,0.15);
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #1e5aa8, #17457f);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 26px;
      flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .info .name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; letter-spacing: -0.3px; }
    .info .name-en { font-size: 11px; font-weight: 500; color: var(--ink-mute); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .info .title { margin-top: 6px; font-size: 13px; color: var(--brand); font-weight: 600; }
    .info .desc { margin-top: 3px; font-size: 12.5px; color: var(--ink-mute); }
    .arrow {
      color: var(--ink-mute);
      font-size: 22px;
      transition: transform 0.15s, color 0.15s;
    }
    .person:hover .arrow { transform: translateX(4px); color: var(--brand); }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-mute);
      line-height: 1.7;
    }
    .footer a { color: var(--ink-mute); text-decoration: underline; margin: 0 6px; }
    .footer a:hover { color: var(--brand); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a class="brand" href="/" aria-label="Info-Gate Inc. Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>INFOGATE</span>
      </a>
      <h1>Digital <em>Cards.</em></h1>
      <p class="lead">주식회사 인포게이트 담당자별 디지털 명함입니다. 이름을 눌러 명함 페이지로 이동, 탭 한 번으로 연락처를 저장하세요.</p>
    </div>

    <div class="list">
      <a class="person" href="/card/pbj/">
        <div class="avatar" aria-hidden="true">박</div>
        <div class="info">
          <div class="name">박봉준</div>
          <div class="name-en">BongJun Park</div>
          <div class="title">대표이사 · CEO</div>
          <div class="desc">Enterprise SI + wowpia 브랜드 총괄</div>
        </div>
        <div class="arrow" aria-hidden="true">→</div>
      </a>
    </div>

    <div class="footer">
      © 2013–2026 <strong>Info-Gate Inc.</strong> · 주식회사 인포게이트 · 부산 해운대구<br>
      <a href="/">회사 소개</a> ·
      <a href="/wowpia/">wowpia</a> ·
      <a href="mailto:wowpia0127@gmail.com">wowpia0127@gmail.com</a>
    </div>
  </div>
</body>
</html>
